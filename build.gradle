plugins {
    id 'fabric-loom' version '1.17.20'
    id 'java'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/releases/' }
    maven { name = 'Shedaniel'; url = 'https://maven.shedaniel.me/' }
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    maven { name = 'DevAuth'; url = 'https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Optional: adds a "Configure" button in Mods -> tacklebox. Never required at runtime.
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

    // The settings screen and config file. Bundled in our jar, so nothing extra to install. 3.11.3 for 1.21.11.
    modImplementation "maven.modrinth:M1953qlQ:8bR7M6K7"
    include "maven.modrinth:M1953qlQ:8bR7M6K7"

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"

    // FOECollab is required at runtime (fabric.mod.json) but never compiled against: the mod only wraps its
    // hud element by id (compat/FoeLook). It is not on a maven, so runClient picks up a jar you drop in
    // run/foecollab/ (build it from github.com/Kimberlyow/FOECollab), plus its own requirement, cloth config.
    modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude group: 'net.fabricmc.fabric-api'
    }
    // Logs the dev client in with your real Microsoft account so runClient can join fishonmc (online mode).
    // Dev only: modLocalRuntime never ends up in the built jar.
    modLocalRuntime 'me.djtheredstoner:DevAuth-fabric:1.2.2'
    // Same as in the normal instance: without it chat is blocked on EU accounts.
    modLocalRuntime 'maven.modrinth:no-chat-restrictions:Fabric-MC1.21.11-v1.0.3'
    modLocalRuntime 'maven.modrinth:mouse-tweaks:1.21.11-2.30-fabric'
    modLocalRuntime fileTree(dir: 'run/foecollab', include: '*.jar')
    modLocalRuntime("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude group: 'net.fabricmc.fabric-api'
    }
}

loom {
    accessWidenerPath = file('src/main/resources/tacklebox.accesswidener')
    runs {
        client {
            property 'devauth.enabled', 'true'
            property 'devauth.account', 'main'
            programArgs '--quickPlayMultiplayer', 'play.fishonmc.net'
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

test {
    useJUnitPlatform()
}
