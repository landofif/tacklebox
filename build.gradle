plugins {
    id 'fabric-loom' version '1.17.20'
    id 'java'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/releases/' }
    maven { name = 'Shedaniel'; url = 'https://maven.shedaniel.me/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Optional: adds a "Configure" button in Mods -> Dofi's Addons. Never required at runtime.
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

    // FOECollab is required at runtime (fabric.mod.json) but never compiled against: the mod only wraps its
    // hud element by id (compat/FoeLook). It is not on a maven, so runClient picks up a jar you drop in
    // run/foecollab/ (build it from github.com/Kimberlyow/FOECollab), plus its own requirement, cloth config.
    modLocalRuntime fileTree(dir: 'run/foecollab', include: '*.jar')
    modLocalRuntime("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude group: 'net.fabricmc.fabric-api'
    }
}

loom {
    accessWidenerPath = file('src/main/resources/dofisaddons.accesswidener')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
