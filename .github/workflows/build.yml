name: build
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write # to delete old artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: chmod +x ./gradlew
      - run: ./gradlew build --no-daemon
      # only after a passing build, so a failed one keeps the last good jar
      - name: Delete artifacts of earlier runs
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: |
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.workflow_run.id != $RUN) | .id" |
          while read -r id; do
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id" || echo "could not delete $id"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: tacklebox
          path: build/libs/*.jar
          retention-days: 7
      - name: Build Prism test instance
        if: github.event_name == 'push'
        run: python3 .github/scripts/prism_instance.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: tacklebox-prism
          path: build/tacklebox-prism.zip
          retention-days: 1 # 13 MB a push: the private repo's artifact storage is small
